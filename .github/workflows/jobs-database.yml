name: job database

# Every day: read the public job databases, merge them and publish the result as a release, which AIHawk reads when it searches.
# Users never scrape anything.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-database
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: room on disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - run: pip install duckdb
      - run: python pipeline/build.py --out work
      - run: python pipeline/publish.py --out work/out --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
