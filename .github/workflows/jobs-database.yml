name: job database

# Every five hours: read the public job databases, merge them and publish the result to the Hugging Face dataset feder-cr/jobs, which AIHawk reads when it searches.
# Five hours because the biggest source, jobhive, publishes around 15:00 UTC and the small new-grad lists every hour; a daily build read them up to a day late.
# Minute 23 because GitHub delays schedules at the top of the hour.
# Users never scrape anything.
on:
  schedule:
    - cron: "23 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-database
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200  # shorter than the five hours to the next run, so a hung build does not take its slot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: room on disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - run: pip install duckdb huggingface_hub pyarrow
      - run: python pipeline/build.py --out work
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}  # the private cache of the sources not changed since the last build
      - run: python pipeline/publish.py --out work/out
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
