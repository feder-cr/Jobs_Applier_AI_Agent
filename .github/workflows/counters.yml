# counters.yml - the daily snapshot of the applications AIHawk has sent, and the README badge.
#
# The applications are counted in PostHog (src/aihawk/telemetry.py) and, for AIHawk before 2026-11-11, by the downloads
# of the usage-counter release's files. Both keep only running totals, so the applications of a day exist only if someone
# records them every day. This is that someone: no machine of ours, just the scheduler, the built-in GITHUB_TOKEN and
# PostHog's read key as a secret. A run that fails sends GitHub's failure mail, and the run's log warns when
# a day between two snapshots is missing. The way invisible_playwright records its browser launches.
#
# Everything it writes lives on the `badges` branch, which is not protected:
#   counters/history.csv             date,key,value - every counter, once a day
#   counters/applications_daily.csv  day_utc,sent,submitted,... - one row per measured day
#   docs/badges/applications.svg
#
# 00:10 UTC, so the snapshot dated D closes calendar day D-1.
name: counters

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: counters
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the script (main)
        uses: actions/checkout@v7
        with:
          path: main

      - name: Check out the badges branch
        uses: actions/checkout@v7
        with:
          ref: badges
          path: badges

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Self-test
        run: python main/scripts/usage_counters.py --selftest

      - name: Record today's counters and redraw the badge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # PostHog's read key, for the applications AIHawk reports there since 2026-11-11.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: >
          python main/scripts/usage_counters.py
          --history badges/counters/history.csv
          --daily badges/counters/applications_daily.csv
          --badges badges/docs/badges

      - name: Commit to the badges branch
        working-directory: badges
        run: |
          set -euo pipefail
          git config user.name "feder-cr"
          git config user.email "85809106+feder-cr@users.noreply.github.com"
          git add counters docs/badges
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          sent=$(awk -F, '$2=="sent"{v=$3} END{print v}' counters/history.csv)
          git commit -q -m "counters: $(date -u +%F), applications sent at ${sent}"
          git push origin HEAD:badges
