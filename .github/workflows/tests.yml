name: tests

on:
  push:
    branches: [main]
  pull_request:
  # invisible-playwright-mcp is never pinned: this says on the day a new release of it stops working with AIHawk.
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: read

jobs:
  unit:
    name: lint and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -m "not browser"

  browser:
    name: the real browser on a real form
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgtk-3-0t64 libasound2t64 libdbus-glib-1-2 libxt6t64
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" pytest -m browser

  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [unit, browser]
    if: always()
    steps:
      - run: test "${{ needs.unit.result }}" = success && test "${{ needs.browser.result }}" = success
