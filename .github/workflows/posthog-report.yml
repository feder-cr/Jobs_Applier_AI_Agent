# posthog-report.yml - prints what PostHog received in the last 24 hours: events, outcomes and reasons, sites, tokens,
# versions. Run by hand from the Actions tab; the read key is the repository's secret POSTHOG_API_KEY.
name: posthog report

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Report
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: python scripts/usage_counters.py --report
