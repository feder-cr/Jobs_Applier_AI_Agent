[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aihawk"
description = "Find the jobs that fit your CV and apply to them, on a model through OrcaRouter and an undetected browser."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dynamic = ["version"]
# invisible-playwright-mcp is never pinned: an install takes its newest release.
dependencies = [
    "click>=8.1",
    "duckdb>=1.1",
    "invisible-playwright-mcp",
    "mcp>=1.9",
    "openai>=1.40",
    "pyyaml>=6",
    "reportlab>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4", "ruff>=0.6"]

[project.scripts]
aihawk = "aihawk.cli:run"

[project.urls]
Homepage = "https://github.com/feder-cr/Jobs_Applier_AI_Agent_AIHawk"

[tool.hatch.version]
path = "src/aihawk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aihawk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["browser: runs the real invisible-playwright-mcp and its Firefox"]

[tool.ruff]
line-length = 160
src = ["src", "tests"]
